<!DOCTYPE html>
<html>
<head>
    <title>Saga тест</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        input, select, button { margin: 5px; padding: 8px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .NEW { background: #e3f2fd; }
        .PAID { background: #c8e6c9; }
        .DONE { background: #a5d6a7; }
        .CANCELLED { background: #ffcdd2; }
        .result { background: #f5f5f5; padding: 10px; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Тестирование Saga корзины</h1>
    
    <div>
        <h3>Создать заказ</h3>
        <input id="userId" placeholder="user_id" value="user123">
        <input id="amount" placeholder="amount" value="1000" type="number">
        <button onclick="createOrder()">Создать</button>
    </div>
    
    <div>
        <h3>ID заказа</h3>
        <input id="orderId" placeholder="order_id">
        <button onclick="getOrder()">Проверить</button>
    </div>
    
    <div>
        <h3>Изменить статус</h3>
        <select id="event">
            <option value="RESERVE_OK">Товар есть (RESERVE_OK)</option>
            <option value="RESERVE_FAIL">Товара нет (RESERVE_FAIL)</option>
            <option value="PAY_OK">Оплата прошла (PAY_OK)</option>
            <option value="PAY_FAIL">Оплата не прошла (PAY_FAIL)</option>
        </select>
        <button onclick="transition()">Применить</button>
    </div>
    
    <div>
        <h3>Статус заказа</h3>
        <div id="statusDisplay" class="status">Нет заказа</div>
    </div>
    
    <div class="result" id="result"></div>

    <script>
        const API_URL = 'http://127.0.0.1:8080';
        
        async function createOrder() {
            const userId = document.getElementById('userId').value;
            const amount = document.getElementById('amount').value;
            
            try {
                const response = await fetch(`${API_URL}/orders`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({user_id: userId, amount: parseFloat(amount)})
                });
                const data = await response.json();
                
                document.getElementById('orderId').value = data.id;
                updateStatusDisplay(data.status);
                document.getElementById('result').innerHTML = 
                    `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                document.getElementById('result').innerHTML = 
                    `<pre style="color:red">Ошибка: ${error}</pre>`;
            }
        }
        
        async function getOrder() {
            const orderId = document.getElementById('orderId').value;
            if (!orderId) return;
            
            try {
                const response = await fetch(`${API_URL}/orders/${orderId}`);
                const data = await response.json();
                
                updateStatusDisplay(data.status);
                document.getElementById('result').innerHTML = 
                    `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                document.getElementById('result').innerHTML = 
                    `<pre style="color:red">Ошибка: ${error}</pre>`;
            }
        }
        
        async function transition() {
            const orderId = document.getElementById('orderId').value;
            const event = document.getElementById('event').value;
            if (!orderId) return;
            
            try {
                const response = await fetch(`${API_URL}/orders/${orderId}/transition`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({event: event})
                });
                const data = await response.json();
                
                updateStatusDisplay(data.current_state);
                
                let message = '';
                if (data.current_state === 'CANCELLED') {
                    if (event === 'RESERVE_FAIL') {
                        message = 'Товара нет в наличии - заказ отменен';
                    } else if (event === 'PAY_FAIL') {
                        message = 'Оплата не прошла - деньги не списаны, товар возвращен';
                    }
                } else if (data.current_state === 'PAID') {
                    message = 'Оплата прошла - товар зарезервирован';
                } else if (data.current_state === 'DONE') {
                    message = 'Заказ выполнен';
                }
                
                document.getElementById('result').innerHTML = 
                    `<pre>${message}\n\n${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                document.getElementById('result').innerHTML = 
                    `<pre style="color:red">Ошибка: ${error}</pre>`;
            }
        }
        
        function updateStatusDisplay(status) {
            const display = document.getElementById('statusDisplay');
            display.className = 'status ' + status;
            
            let text = '';
            if (status === 'NEW') text = 'Новый заказ ';
            else if (status === 'PAID') text = 'Оплачен';
            else if (status === 'DONE') text = 'Завершен';
            else if (status === 'CANCELLED') text = 'Отменен';
            
            display.innerHTML = `<strong>${status}</strong> - ${text}`;
        }
    </script>
</body>
</html>
