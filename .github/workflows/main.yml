name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  IMAGE_NAME: tickets-s04                      # project_code из week-14.json
  REGISTRY: docker.io
  IMAGE_REPOSITORY: ${{ github.repository }}
  IMAGE_TAG: "${{ github.sha }}"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Можно добавить --exit-zero, если линтер не должен падать в PR


    - name: Build Docker image
      run: |
        docker service/build \
          --file Dockerfile \
          --tag "$IMAGE_NAME:$IMAGE_TAG" \
          --tag "$IMAGE_NAME:latest" \
          .

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME:${{ github.sha }}
          ${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME:latest
