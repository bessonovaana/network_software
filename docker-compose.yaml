version: "3.9"

services:
  service1:
    build:
      context: ./service1
      dockerfile: Dockerfile
    container_name: service1
    ports:
      - "8101:8000"
    networks:
      backend:
        aliases:
          - service1

  service2:
    build:
      context: ./service2
      dockerfile: Dockerfile
    container_name: service2
    ports:
      - "8102:8000"
    networks:
      backend:
        aliases:
          - service2

  nginx:
    image: nginx:1.25
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - service1
      - service2
    networks:
      backend:
        aliases:
          - nginx

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      backend:
        aliases:
          - redis
    command: redis-server --appendonly yes

networks:
  backend:
    driver: bridge
    name: backend