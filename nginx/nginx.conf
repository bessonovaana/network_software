events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name localhost;

        location = /user-service { return 301 /user-service/; }
        location = /order-service { return 301 /order-service/; }
        location = /notification-service { return 301 /notification-service/; }

        location /user-service/ {
            proxy_pass http://user-service:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        location /order-service/ {
            proxy_pass http://order-service:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /notification-service/ {
            proxy_pass http://notification-service:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Корневой маршрут
        location / {
            return 200 'Nginx is working!\n';
            add_header Content-Type text/plain;
        }
    }
}